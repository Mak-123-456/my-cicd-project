name: Build and Push to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t my-node-app .

          - name: Tag Docker Image
        run: docker tag my-node-app:latest ${{ steps.login-ecr.outputs.registry }}/my-node-app:latest

      - name: Deploy to ECS
        run: aws ecs update-service --cluster my-node-cluster --service my-node-service-service-w2tfxzwf --force-new-deployment --region ap-south-1
